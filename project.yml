name: ThreeLineCal
options:
  bundleIdPrefix: im.zzn.apps
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "859JWBWE5P"
    # Extract SwiftUI/String(localized:) keys during builds so the string catalog stays in sync.
    SWIFT_EMIT_LOC_STRINGS: YES

# Declaring any scheme disables Xcode's auto-created ones, so declare them all.
schemes:
  ThreeLineCal:
    build:
      targets:
        ThreeLineCal: all
  ThreeLineCalWatch:
    build:
      targets:
        ThreeLineCalWatch: all
  ThreeLineCalMac:
    build:
      targets:
        ThreeLineCalMac: all
  # `xcodebuild test -scheme ThreeLineCalUITests` adds the widget via Springboard
  ThreeLineCalUITests:
    build:
      targets:
        ThreeLineCal: all
        ThreeLineCalUITests: [test]
    test:
      targets:
        - ThreeLineCalUITests

targets:
  # iOS companion app — makes this an iOS delivery (uploadable via standard tooling)
  # (SharedWidget is included for the DEBUG widget-render harness; unused in Release.)
  ThreeLineCal:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: SharedWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.zzn.apps.threelinecal
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: iOS/ThreeLineCal.entitlements
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: "3 Line Cal Watch Face"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleIconName: AppIcon
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: "3-Line Calendar shows your upcoming calendar events in the app and its widgets."
        NSCalendarsUsageDescription: "3-Line Calendar shows your upcoming calendar events in the app and its widgets."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: ThreeLineCalWatch
        embed: true
      - target: ThreeLineCalWidget
        embed: true

  # watchOS app — embedded in the iOS app
  ThreeLineCalWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.zzn.apps.threelinecal.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Watch/ThreeLineCalWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: "3 Line Cal Watch Face"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleIconName: AppIcon
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: im.zzn.apps.threelinecal
        # Deep-link scheme the complication's widgetURL targets (also enables
        # `simctl openurl` testing of the tap-through).
        CFBundleURLTypes:
          - CFBundleURLName: im.zzn.apps.threelinecal.watchkitapp
            CFBundleURLSchemes: [threelinecal]
        NSCalendarsFullAccessUsageDescription: "3-Line Calendar shows your upcoming calendar events on your watch face."
        NSCalendarsUsageDescription: "3-Line Calendar shows your upcoming calendar events on your watch face."
    dependencies:
      - target: ThreeLineCalComplication
        embed: true

  # iOS/iPadOS home-screen + lock-screen widget — embedded in the iOS app
  ThreeLineCalWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: SharedWidget
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.zzn.apps.threelinecal.widget
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widget/ThreeLineCalWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "3 Line Cal Watch Face"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Required in the appex plist — EventKit is read in the widget process.
        NSCalendarsFullAccessUsageDescription: "Shows your upcoming calendar events in the widget."
        NSCalendarsUsageDescription: "Shows your upcoming calendar events in the widget."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # macOS app — same bundle ID as the iOS app => universal purchase; hosts the desktop widget
  ThreeLineCalMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: SharedWidget
      - path: Mac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.zzn.apps.threelinecal
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Mac/ThreeLineCalMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: "3 Line Cal Watch Face"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleIconName: AppIcon
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Z. Victor Zhou"
        NSCalendarsFullAccessUsageDescription: "3-Line Calendar shows your upcoming calendar events in the app and its widgets."
        NSCalendarsUsageDescription: "3-Line Calendar shows your upcoming calendar events in the app and its widgets."
    dependencies:
      - target: ThreeLineCalMacWidget
        embed: true

  # macOS desktop/Notification Center widget — embedded in the Mac app
  ThreeLineCalMacWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Shared
      - path: SharedWidget
      - path: MacWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.zzn.apps.threelinecal.widget
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MacWidget/ThreeLineCalMacWidget.entitlements
    info:
      path: MacWidget/Info.plist
      properties:
        CFBundleDisplayName: "3 Line Cal Watch Face"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Required in the appex plist — EventKit is read in the widget process.
        NSCalendarsFullAccessUsageDescription: "Shows your upcoming calendar events in the widget."
        NSCalendarsUsageDescription: "Shows your upcoming calendar events in the widget."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # UI tests — drives Springboard to add the real widget to the sim home screen
  ThreeLineCalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        TEST_TARGET_NAME: ThreeLineCal
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ThreeLineCal

  # watchOS complication (WidgetKit) — embedded in the watch app
  ThreeLineCalComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: Shared
      - path: SharedWidget
      - path: Complication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.zzn.apps.threelinecal.watchkitapp.widget
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Complication/ThreeLineCalComplication.entitlements
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Complication/Info.plist
      properties:
        CFBundleDisplayName: "3 Line Cal Watch Face"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
