name: ThreeLineCal
options:
  bundleIdPrefix: im.zzn.apps
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "859JWBWE5P"
    # Extract SwiftUI/String(localized:) keys during builds so the string catalog stays in sync.
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  # iOS companion app — makes this an iOS delivery (uploadable via standard tooling)
  ThreeLineCal:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.zzn.apps.threelinecal
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: iOS/ThreeLineCal.entitlements
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: "3 Line Cal Watch Face"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleIconName: AppIcon
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCalendarsFullAccessUsageDescription: "3-Line Calendar shows your upcoming calendar events in the app and its widgets."
        NSCalendarsUsageDescription: "3-Line Calendar shows your upcoming calendar events in the app and its widgets."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: ThreeLineCalWatch
        embed: true

  # watchOS app — embedded in the iOS app
  ThreeLineCalWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.zzn.apps.threelinecal.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Watch/ThreeLineCalWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: "3 Line Cal Watch Face"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleIconName: AppIcon
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: im.zzn.apps.threelinecal
        NSCalendarsFullAccessUsageDescription: "3-Line Calendar shows your upcoming calendar events on your watch face."
        NSCalendarsUsageDescription: "3-Line Calendar shows your upcoming calendar events on your watch face."
    dependencies:
      - target: ThreeLineCalComplication
        embed: true

  # watchOS complication (WidgetKit) — embedded in the watch app
  ThreeLineCalComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: Shared
      - path: Complication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.zzn.apps.threelinecal.watchkitapp.widget
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Complication/ThreeLineCalComplication.entitlements
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Complication/Info.plist
      properties:
        CFBundleDisplayName: "3 Line Cal Watch Face"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
